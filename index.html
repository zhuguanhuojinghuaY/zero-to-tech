<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢王峥这件事</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">写给王峥</p>
        <h1 id="page-title">喜欢你，是我心里很亮的一件事</h1>
        <p class="lead">
          王峥这个名字，好像自带一点温柔。每次想到你，平凡的日子都会变得更认真、更可爱，也更值得期待。
        </p>
        <div class="actions">
          <button type="button" onclick="changeText()">换一句喜欢你的话</button>
          <span id="msg">你出现以后，很多小事都有了特别的意义。</span>
        </div>
      </div>

      <div class="portrait" aria-label="关于王峥的温柔印象">
        <div class="sun"></div>
        <div class="letter">
          <span>Wang Zheng</span>
          <strong>喜欢你</strong>
          <small>不止今天</small>
        </div>
      </div>
    </section>

    <section class="reasons" aria-label="喜欢王峥的理由">
      <article>
        <span>01</span>
        <h2>喜欢你的特别</h2>
        <p>你有一种让人安定下来的力量，不用很热闹，也能让人觉得靠近你是一件很幸运的事。</p>
      </article>
      <article>
        <span>02</span>
        <h2>喜欢你的认真</h2>
        <p>你对生活、对人、对自己在意的事情，都带着很真诚的态度，这种光芒很难不被看见。</p>
      </article>
      <article>
        <span>03</span>
        <h2>喜欢和你有关的以后</h2>
        <p>想到未来也许会有更多与你有关的瞬间，就会忍不住期待明天快一点到来。</p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
